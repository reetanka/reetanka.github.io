<head>

  <meta property="og:title" content="Dr. Reetanka Jana">

  <meta name="theme-color" content="#0b1020">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --glass: rgba(255,255,255,.07);
      --glass-hover: rgba(255,255,255,.13);
      --border: rgba(255,255,255,.14);
      --text: #f5f7ff;
      --muted: #aab2d0;
      --a1: #5eead4;   /* teal */
      --a2: #a78bfa;   /* violet */
      --a3: #f472b6;   /* pink */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      min-height: 100vh;
      font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      display: flex; justify-content: center;
      padding: 56px 18px 40px;
      position: relative; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* animated gradient orbs */
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .45; z-index: 0; pointer-events: none; }
    .o1 { width: 340px; height: 340px; background: var(--a2); top: -90px; left: -90px; animation: drift 14s ease-in-out infinite alternate; }
    .o2 { width: 300px; height: 300px; background: var(--a1); bottom: -80px; right: -80px; animation: drift 17s ease-in-out infinite alternate-reverse; }
    .o3 { width: 220px; height: 220px; background: var(--a3); top: 45%; left: 55%; opacity: .25; animation: drift 20s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translate(40px, 60px) scale(1.15); } }

    main { position: relative; z-index: 1; width: 100%; max-width: 440px; text-align: center; animation: rise .7s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } }

    .avatar-wrap {
      width: 112px; height: 112px; margin: 0 auto 18px;
      padding: 3px; border-radius: 50%;
      background: conic-gradient(var(--a1), var(--a2), var(--a3), var(--a1));
      animation: spin 8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar {
      width: 100%; height: 100%; border-radius: 50%;
      background: var(--bg); display: grid; place-items: center;
      overflow: hidden; border: 3px solid var(--bg);
      animation: spin 8s linear infinite reverse; /* keeps photo upright */
      font-size: 42px; font-weight: 600;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    h1 { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
    .tagline {
  margin-top: 10px;
  font-size: 18px;
  font-weight: 500;
  letter-spacing: .02em;
  background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent; }
    .bio { margin-top: 8px; color: var(--muted); font-size: 16px; line-height: 1.5; }

    .pulse { width: 150px; height: 28px; margin: 14px auto 0; display: block; }
    .pulse path {
      fill: none; stroke: var(--a1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 260; stroke-dashoffset: 260; animation: beat 3s ease-in-out infinite;
    }
    @keyframes beat { 0% { stroke-dashoffset: 260; } 60%, 100% { stroke-dashoffset: 0; } }

    .socials { display: flex; justify-content: center; gap: 12px; margin: 24px 0 28px; flex-wrap: wrap; }
    .socials a {
      width: 46px; height: 46px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--glass); border: 1px solid var(--border);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      color: var(--text); transition: transform .2s, background .2s, color .2s;
    }
    .socials a:hover, .socials a:focus-visible { transform: translateY(-4px) scale(1.08); background: var(--glass-hover); color: var(--a1); outline: none; }
    svg { width: 21px; height: 21px; fill: currentColor; }

    ul { list-style: none; display: grid; gap: 14px; }
    .link {
      position: relative; display: flex; align-items: center; gap: 14px;
      padding: 17px 22px; border-radius: 18px;
      background: var(--glass); border: 1px solid var(--border);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: var(--text); text-decoration: none; font-weight: 500; font-size: 17px;
      transition: transform .2s, background .2s, border-color .2s, box-shadow .2s;
    }
    .link:hover, .link:focus-visible {
      transform: translateY(-3px); background: var(--glass-hover);
      border-color: var(--a1); box-shadow: 0 10px 30px -10px var(--a2); outline: none;
    }
    .link .label { flex: 1; text-align: left; }
    .link .arrow { color: var(--a1); transition: transform .2s; }
    .link:hover .arrow { transform: translateX(5px); }

    footer { margin-top: 38px; color: var(--muted); font-size: 13px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .pulse path { stroke-dashoffset: 0; }
    }
  </style>
</head>
